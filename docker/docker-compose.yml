services:
  stonefish_sim:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    image: aqua/stonefish-sim:jazzy-dev
    container_name: aqua_slam_testbed

    network_mode: host
    ipc: host

    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=graphics,compute,utility

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ../scenarios:/ros2_ws/scenarios:ro
      - ../launch:/ros2_ws/launch:ro
      - ../scripts:/ros2_ws/scripts:ro

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    tty: true
    stdin_open: true
    restart: unless-stopped
